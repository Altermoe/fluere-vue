# 文档站静态托管（容器内 /etc/nginx/conf.d/fluere-vue.conf）
#
# 由 scripts/deploy.sh 每次部署写入宿主 <DEPLOY_ROOT>/nginx/fluere-vue.conf，容器把这个
# 目录挂到 /etc/nginx/conf.d，所以改配置 = 改仓库 + 重新部署，不需要重建镜像。
#
# 职责边界：本层只做「静态文件 + 压缩 + 缓存 + 安全头」。TLS 证书、域名、HSTS 由外层反代
# （宝塔）在 HTTPS 终止处负责，因此这里只 listen 80，也不写 listen 443。
#
# 占位符 __DEPLOY_ROOT__ 由 scripts/deploy.sh 用实际部署根目录替换（默认 /srv/fluere-vue），
# 避免「脚本支持改根目录、配置却写死」的不一致。

server {
    listen 80;
    server_name _;

    # 不暴露 nginx 版本号
    server_tokens off;

    # current 是指向 releases/<tag> 的符号链接：切链接即换版本，无需重启容器。
    root __DEPLOY_ROOT__/current;
    index index.html;

    # --- 压缩：有预压缩产物（.gz）就直出，没有就动态压缩 ---
    # 官方 nginx 镜像带 --with-http_gzip_static_module，但没有 brotli 模块，
    # 所以只能写 gzip_static，写 brotli_static 会让容器起不来。
    # 仓库当前不生成 .gz（见 docs/todo.md 的可选优化），这里先留好开关。
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml application/wasm
               font/woff font/woff2;

    # 安全头：nginx 的 add_header 是「覆盖」而非「叠加」——某个层级只要自己写了
    # add_header，上层全部失效。所以下面每个写了缓存头的 location 都必须重新 include，
    # 否则安全头会静默消失（只在那几个 location 上）。
    include /etc/nginx/conf.d/security-headers.inc;

    # 默认不缓存：能走到 location / 的是预渲染 HTML（目录式路由落到这里），
    # 发版后必须立刻可见。下面各 location 用各自的 add_header 覆盖掉这条。
    add_header Cache-Control "no-cache" always;

    # Nuxt 构建产物：文件名含内容哈希 → 一年 immutable。
    # 必须用 ^~ 前缀匹配：普通前缀 location 会被下面的正则 location（按扩展名）抢走。
    location ^~ /_nuxt/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Nuxt Content 的 sql dump：文件名固定（__nuxt_content/<collection>/sql_dump.txt），
    # 内容随发布变化 → 绝不能长缓存。
    location ^~ /__nuxt_content/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # i18n 语言包：目录名带构建哈希（_i18n/<hash>/<locale>/messages.json），
    # 但哈希是否随内容变化不由本仓库保证 → 保守只给一天。
    location ^~ /_i18n/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # 预渲染 HTML 与 Nuxt payload：必须短缓存，否则发版后用户仍看到旧页面。
    location ~* (?:\.html|_payload\.json)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # 其余静态资源（图标、图片、字体、map 等）
    location ~* \.(?:css|js|mjs|map|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|otf|eot|wasm|txt|xml)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # 目录式路由：/components/button → components/button/index.html，
    # **故意不写 `$uri/`**：那会让 nginx 对无尾斜杠的目录发 301，把 URL 变成
    # /components/button/，而文档站用 `queryCollection().where('path','=',route.path)`
    # 精确匹配 Nuxt Content 的 path —— 多一个尾斜杠就查不到正文（实测页面显示
    # 「未找到内容」）。用 $uri/index.html 直接命中文件，URL 保持用户输入的样子。
    # 站点内部链接与产物里的资源引用都是绝对路径（/_nuxt/...），不存在相对路径歧义。
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Nuxt 静态导出自带 404.html，走 error_page 而不是 SPA 回退
    error_page 404 /404.html;
}
