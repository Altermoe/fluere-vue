<!--
  站点 favicon：与 components/brand-logo.vue 同一枚「浅蓝倒三角 + 内层 V 形」标识
  （几何与配色逐点一致；页内徽标走组件，静态文件这里只能是副本，改一处必须同步另一处）。
  几何：包围盒 28 × 25 的近方形（原为 26 × 28 的竖长形，视觉上偏「修长」），
  各锐角（两顶角、底部收尖、顶边 V 形缺口）均改为圆弧（外层圆角 2.2、内层 1.3）。
  旧版是 Windows 四宫格 logo，属他人商标，已替换。
-->
<svg width="256" height="256" version="1.1" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- 外层：浅蓝倒三角（顶边留出 V 形缺口，各角为圆弧） -->
  <path d="M 3.83 6.77 A 2.2 2.2 0 0 1 5.75 3.5 L 11.04 3.5 A 2.2 2.2 0 0 1 12.88 4.5 L 14.89 7.6 A 1.32 1.32 0 0 0 17.11 7.6 L 19.12 4.5 A 2.2 2.2 0 0 1 20.96 3.5 L 26.25 3.5 A 2.2 2.2 0 0 1 28.17 6.77 L 17.92 25.07 A 2.2 2.2 0 0 1 14.08 25.07 L 3.83 6.77 Z" fill="#7FDEFF"></path>
  <!-- 内层：深蓝 V 形带（与缺口同拓扑，各角为圆弧） -->
  <path d="M 19.38 4.09 A 1.3 1.3 0 0 1 20.48 3.5 L 22.85 3.5 A 1.3 1.3 0 0 1 23.96 5.47 L 16.67 17.57 A 0.78 0.78 0 0 1 15.33 17.57 L 8.04 5.47 A 1.3 1.3 0 0 1 9.15 3.5 L 11.52 3.5 A 1.3 1.3 0 0 1 12.62 4.09 L 14.91 7.62 A 1.3 1.3 0 0 0 17.09 7.62 L 19.38 4.09 Z" fill="#0E8CE1"></path>
</svg>